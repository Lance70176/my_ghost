<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyGhost Web</title>
<!-- Added to the Home Screen this opens without browser chrome, which with
     ?tab= makes it behave like a dedicated app for one session. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyGhost">
<meta name="theme-color" content="#171922">
<!-- Home Screen / tab icon: the same mark as the desktop app. -->
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <button id="expand-sidebar" class="hidden" title="Show sidebar">›</button>
  <aside id="sidebar">
    <div id="ai-usage">
      <div class="ai-header">
        <span>AI Usage</span>
        <button id="collapse-sidebar" title="Hide sidebar">‹</button>
      </div>
      <div id="ai-body"></div>
    </div>

    <!-- Permission requests held by ghost-agentd: the fallback for when
         Telegram is unreachable. Hidden while nothing is waiting. -->
    <div id="decisions" class="hidden"></div>

    <div id="mode-bar">
      <button id="mode-term" class="mode active" title="Terminal tabs">Tabs</button>
      <button id="mode-agent" class="mode" title="Project assistants">AI Agent</button>
    </div>

    <div id="tab-pane">
      <div id="tab-actions">
        <button id="new-tab" title="New tab">＋</button>
        <button id="close-tab" title="Close the attached tab">－</button>
        <span id="host-name"></span>
      </div>
      <div id="tab-list"></div>
    </div>

    <div id="agent-pane" class="hidden">
      <div id="agent-list"></div>
    </div>
  </aside>

  <!-- One assistant's conversation. Its decisions live in a drawer pulled
       out from the right edge, and a decision opens on a page of its own. -->
  <main id="agent-wrap">
    <div id="agent-header">
      <button id="agent-back" class="round-btn" title="Back to assistants">&#8249;</button>
      <div id="agent-heading">
        <div id="agent-title"></div>
        <div id="agent-sub"></div>
      </div>
    </div>
    <div id="agent-chat"></div>
    <div id="agent-compose">
      <textarea id="agent-input" rows="1" placeholder="跟助手說…"></textarea>
      <button id="agent-send" title="Send">➤</button>
    </div>
    <button id="drawer-handle" title="決策清單"><span class="chev">&#8249;</span><span id="drawer-count"></span></button>
    <aside id="agent-drawer">
      <div class="drawer-section">
        <div class="drawer-title">待決策</div>
        <div id="drawer-pending"></div>
      </div>
      <div class="drawer-section">
        <div class="drawer-title">決策紀錄</div>
        <div id="drawer-history"></div>
      </div>
    </aside>
    <div id="agent-detail" class="hidden">
      <div id="detail-header">
        <button id="detail-back" class="round-btn" title="Back">&#8249;</button>
        <div id="detail-title"></div>
      </div>
      <div id="detail-body"></div>
    </div>
  </main>

  <main id="term-wrap">
    <!-- On a phone the list and the terminal are separate screens, so the
         terminal carries its own way back. Hidden on desktop, where both
         panes are visible at once and nothing needs navigating to. -->
    <div id="term-header">
      <button id="back-to-list" title="Back to sessions">&#8249;</button>
      <span id="term-title"></span>
    </div>
    <div id="term-empty">Select a tab to attach</div>
    <div id="terminal"></div>
    <!-- Touch devices compose here instead of typing into the terminal:
         iOS dictation and IME rewrite text as they go, which the terminal
         can only take as a stream of fresh keystrokes. -->
    <!-- Always-visible scroll control on touch: a swipe can be claimed by a
         full-screen program, a button never is. -->
    <div id="scroll-pad" class="hidden">
      <button data-scroll="1" title="Scroll back">&#9650;</button>
      <button data-scroll="-1" title="Scroll forward">&#9660;</button>
    </div>

    <div id="compose" class="hidden">
      <div id="compose-keys">
        <div class="key-row">
          <button data-key="esc">esc</button>
          <button data-key="tab">tab</button>
          <button data-key="ctrlc">^C</button>
          <button data-key="up">&#8593;</button>
          <button data-key="down">&#8595;</button>
          <button id="compose-newline" title="Insert a line break without sending">&#9166;+</button>
        </div>
        <!-- Editing what is already on the program's input line: once text
             leaves the compose box there is no other way to change it, since
             the terminal's own field never raises the keyboard. Held down,
             these repeat like a real key. -->
        <div class="key-row">
          <button data-key="left" data-repeat title="Left">&#8592;</button>
          <button data-key="right" data-repeat title="Right">&#8594;</button>
          <button data-key="back" data-repeat title="Backspace">&#9003;</button>
        </div>
      </div>
      <div id="compose-row">
        <textarea id="compose-input" rows="1" placeholder="Type or dictate, then send…"
                  autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
        <button id="compose-send" title="Send">➤</button>
      </div>
    </div>
  </main>
</div>
<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script src="/app.js"></script>
</body>
</html>
