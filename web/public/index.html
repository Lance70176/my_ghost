<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyGhost Web</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div id="ai-usage">
      <div class="ai-header">AI Usage</div>
      <div id="ai-body"></div>
    </div>

    <div id="mode-bar">
      <button id="mode-term" class="mode active" title="Terminal tabs">Tabs</button>
      <button id="mode-files" class="mode" title="File browser">Files</button>
    </div>

    <div id="tab-pane">
      <div id="tab-actions">
        <button id="new-tab" title="New web tab">＋</button>
        <span id="host-name"></span>
      </div>
      <div id="tab-list"></div>
    </div>

    <div id="file-pane" class="hidden">
      <div id="crumbs"></div>
      <div id="file-actions">
        <label class="upload-btn">⬆ Upload<input type="file" id="upload-input" multiple></label>
      </div>
      <div id="file-list"></div>
    </div>
  </aside>

  <main id="term-wrap">
    <div id="term-empty">Select a tab to attach</div>
    <div id="terminal"></div>
  </main>
</div>
<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script src="/app.js"></script>
</body>
</html>
