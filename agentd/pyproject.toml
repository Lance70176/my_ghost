[project]
name = "ghost-agentd"
version = "0.1.0"
description = "MyGhost project-assistant daemon: permission relay and Telegram decision cards"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
